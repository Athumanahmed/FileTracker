# LOCAL DEVELOPMENT — hot-reload backend (nodemon) + hot-reload frontend (Vite).
# Run:   docker compose -f docker-compose.dev.yml up --build
#
# For a VPS / production deploy, use the plain docker-compose.yml instead:
# docker compose up -d --build
# See SETUP.md for details.

services:
  db:
    image: postgres:15
    container_name: FileTracker-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: FileTracker-@2026
      POSTGRES_DB: FileTrackerDB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: FileTracker-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fileTrackerMinioAdmin
      MINIO_ROOT_PASSWORD: FileTracker-Minio-@2026
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: fileTracker-backend-dev
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql://postgres:FileTracker-@2026@db:5432/FileTrackerDB?schema=public
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: fileTrackerMinioAdmin
      MINIO_SECRET_KEY: FileTracker-Minio-@2026
      CLIENT_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    ports:
      - "5051:5051"

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: fileTracker-frontend-dev
    restart: unless-stopped
    environment:
      VITE_ENV_MODE: development
      VITE_BACKEND_URL: http://localhost:5051
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  minio_data:
  server_node_modules:
  client_node_modules:
