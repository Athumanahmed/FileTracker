# PRODUCTION / VPS deploy — static built frontend (nginx), no hot-reload.
# Run:   docker compose up -d --build
#
# For local development with live code reload, use docker-compose.dev.yml
# instead: docker compose -f docker-compose.dev.yml up --build
# See SETUP.md for details.

services:
  db:
    image: postgres:15
    container_name: FileTracker-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: FileTracker-@2026
      POSTGRES_DB: FileTrackerDB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: FileTracker-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fileTrackerMinioAdmin
      MINIO_ROOT_PASSWORD: FileTracker-Minio-@2026
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: FileTracker-redis
    restart: always
    # No ports exposed to the host on purpose -- Redis has no auth
    # configured, so it must stay reachable only from other containers on
    # this compose network (backend talks to it as `redis:6379`), never
    # from outside the VPS.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fileTracker-backend
    restart: always
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql://postgres:FileTracker-@2026@db:5432/FileTrackerDB?schema=public
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: fileTrackerMinioAdmin
      MINIO_SECRET_KEY: FileTracker-Minio-@2026
      REDIS_URL: redis://redis:6379
      # Override these in ./server/.env for a real domain, e.g.
      # CITIZEN_PORTAL_URL=https://track.tabora.go.tz
      # CORS_ORIGINS=https://efms.tabora.go.tz,https://track.tabora.go.tz
      CITIZEN_PORTAL_URL: ${CITIZEN_PORTAL_URL:-http://localhost:3001}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5051:5051"

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: fileTracker-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

  # Public, unauthenticated citizen file-tracking portal (separate app).
  # Its own nginx proxies /api/v1/track to the backend, so no build-time
  # backend URL is needed.
  citizen-portal:
    build:
      context: ./citizen-portal
      dockerfile: Dockerfile
    container_name: fileTracker-citizen-portal
    restart: always
    depends_on:
      - backend
    ports:
      - "3001:80"

volumes:
  postgres_data:
  minio_data:
